meta:
  name: "fan_timer Operation Verification"

# シミュレーション注意事項:
#   PT=T#30m はシミュレーターで 30サイクルとして模擬（実時間ではなくロジック検証用）。
#
# 確認シナリオ:
#   Scene 1 (cycle  3): 起動ボタン（パルス）→ タイマー自動停止 (cycle 33)
#   Scene 2 (cycle 38): 再起動（パルス）→ 手動停止 (cycle 48)
#   Scene 3 (cycle 53): 起動ボタンを押し続ける → タイマー自動停止後に再起動しないことを確認
#   Scene 4 (cycle 90): 押し続けを解除 → 改めてパルスで起動できることを確認

initial:
  ESTOP: true       # B接点: 通常 ON (健全)

steps:
  # --- Scene 1: 起動（パルス）→ タイマー自動停止 ---
  - at_cycle: 3
    inputs:
      RUN_PB: true
  - at_cycle: 4
    inputs:
      RUN_PB: false
  # T_AUTO_STOP が 30サイクル計時 → cycle 33 で自動停止

  # --- Scene 2: 再起動（パルス）→ 手動停止 ---
  - at_cycle: 38
    inputs:
      RUN_PB: true
  - at_cycle: 39
    inputs:
      RUN_PB: false
  - at_cycle: 48
    inputs:
      STOP_PB: true
  - at_cycle: 49
    inputs:
      STOP_PB: false

  # --- Scene 3: 起動ボタンを押し続ける（エッジ検出の確認）---
  # RUN_PB を cycle 53 から押し続ける。cycle 83 でタイマー満了し自動停止。
  # その後も RUN_PB は ON のままだが、エッジ検出により再起動しないことを確認。
  - at_cycle: 53
    inputs:
      RUN_PB: true
  # RUN_PB はそのまま押し続け（解除しない）
  # 自動停止 → cycle 83 ごろ

  # --- Scene 4: 押し続けを解除し、改めてパルスで起動 ---
  - at_cycle: 90
    inputs:
      RUN_PB: false
  - at_cycle: 93
    inputs:
      RUN_PB: true
  - at_cycle: 94
    inputs:
      RUN_PB: false

cycles: 100

watch:
  - RUN_PB
  - STOP_PB
  - ESTOP
  - M_RUNNING
  - T_AUTO_STOP_Q
  - FAN_MOTOR
  - RUN_LAMP
